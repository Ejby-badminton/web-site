{% if jekyll.environment == "production" %}
  {% assign gid = site.env.NETLIFY_GOOGLE_ANALYTICS_ID | default: site.data.seo.google_analytics_id | strip %}
  {% if gid != "" %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ gid }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', '{{ gid }}');
    </script>
  {% endif %}
{% endif %}
