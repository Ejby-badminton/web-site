baseurl: ''
permalink: pretty
title: 'Ejby Badminton'

lang: 'da'

description: 'Ejby Badminton Klub — Badminton for alle!'

author:
  name: 'William Bergmann Børresen'
  email: 'wbb@ejbyif-badminton.dk'

url: 'https://ejbyif-badminton.dk'

logo:
  mobile: "/images/logo/ejby_if_logo.png"
  mobile_height: 100
  mobile_width: 100
  desktop: "/images/logo/ejby_if_logo.png"
  desktop_height: 100
  desktop_width: 100

home: 
  limit_services: 6

collections:
  services:
    output: true
    sort_by: weight
  team:
    output: true

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-environment-variables

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
