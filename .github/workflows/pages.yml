name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: |
          cd "$GITHUB_WORKSPACE"
          bundle exec jekyll build --destination _site

      # Samme script som ./scripts/build.sh kører lokalt. Det fejler, hvis
      # CSS'en ikke bliver mindre, eller hvis en nødvendig selektor forsvinder.
      # De tidligere to trin afsluttede med kode 0 uden at skrive noget, så
      # den udgivne CSS var i praksis aldrig renset.
      - name: Optimize CSS (production)
        run: |
          cd "$GITHUB_WORKSPACE"
          ./scripts/optimize-css.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
