name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

defaults:
  run:
    shell: bash
    working-directory: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run link checker
        run: |
          bundle exec jekyll serve --host 127.0.0.1 --port 4000 --baseurl '' >/tmp/jekyll.log 2>&1 &
          JEKYLL_PID=$!
          trap 'kill $JEKYLL_PID' EXIT
          echo "Venter på at Jekyll starter..."
          sleep 5
          npx broken-link-checker http://127.0.0.1:4000 --recursive --filter-level 3
        env:
          JEKYLL_ENV: production
