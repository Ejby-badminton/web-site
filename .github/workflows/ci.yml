name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install gems
        env:
          BUNDLE_GEMFILE: Gemfile
        run: |
          cd "$GITHUB_WORKSPACE"
          bundle install --jobs 4 --retry 3

      - name: Build site
        env:
          BUNDLE_GEMFILE: Gemfile
        run: |
          cd "$GITHUB_WORKSPACE"
          bundle exec jekyll build

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run link checker
        env:
          BUNDLE_GEMFILE: Gemfile
          JEKYLL_ENV: production
        run: |
          cd "$GITHUB_WORKSPACE"
          bundle exec jekyll serve --host 127.0.0.1 --port 4000 --baseurl '' >/tmp/jekyll.log 2>&1 &
          JEKYLL_PID=$!
          trap 'kill $JEKYLL_PID 2>/dev/null || true' EXIT
          echo "Venter på at Jekyll starter..."
          # Wait for Jekyll to be ready (max 60 seconds)
          for i in {1..60}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4000 | grep -q "200"; then
              echo "Jekyll er klar efter $i sekunder"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Jekyll startede ikke i tide. Log:"
              cat /tmp/jekyll.log
              exit 1
            fi
            sleep 1
          done
          npx broken-link-checker http://127.0.0.1:4000 --recursive --filter-level 3 \
            --exclude "https://www.google.com/maps" \
            --exclude "https://maps.google.com" \
            --exclude "https://www.dgi.dk/badminton" \
            --exclude "https://www.dgi.dk/idr%C3%A6t/badminton" \
            --exclude "https://badmintondenmark.tournamentsoftware.com"
