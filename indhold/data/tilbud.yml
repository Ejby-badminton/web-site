- slug: senior-motion
  title: "Senior Motion"
  season: "2026/2027"
  blurb: >-
    Motionistafdelingen samler godt 30 badmintonentusiaster på tværs af niveauer.
    Vi spiller to gange om ugen, hvor tempoet er hyggeligt men engageret,
    og nye spillere får op til 3 gratis prøvetimer, så de kan mærke stemningen.
  times:
    - "Mandag og onsdag kl. 19.00-21.00 i Ejbyhallen (17. august 2026 – 28. april 2027)."
  signup:
    - "Mød op i Ejbyhallen en mandag eller onsdag kl. 19-21 og spørg efter William for en prøvetime."
  pricing:
    - "1 dag pr. uge: 1.100 kr. for hele sæsonen inkl. bolde."
    - "Begge dage pr. uge: 1.700 kr. for hele sæsonen inkl. bolde."
  contacts:
    - name: "William"
      phone: "+45 60 71 40 19"

- slug: flex-hygge
  title: "Flex-hygge Badminton"
  season: "2026/2027"
